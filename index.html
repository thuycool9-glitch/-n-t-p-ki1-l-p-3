<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENGLISH 3 – SEMESTER 1 REVIEW</title>
<style>
:root{--bg:#e8f6ff;--ink:#23395b;--blue:#2f80ed;--green:#27ae60;--orange:#f2994a;--card:#fff;--sun:#ffd23f}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:linear-gradient(#bfe7ff,#e8f6ff 40%,#fff6d6);color:var(--ink);min-height:100vh}
#app{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 0 #c9dff0;margin:12px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,5vw,42px);margin:6px 0;color:var(--blue)}h2{margin:4px 0}
.mascot{font-size:64px}.sub{font-size:20px;color:#e67e22;font-weight:bold}
.btn{font:inherit;font-weight:bold;font-size:20px;border:0;border-radius:16px;padding:14px 22px;margin:5px;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1b5db3;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.g{background:var(--green);box-shadow:0 4px 0 #1b8a49}.btn.o{background:var(--orange);box-shadow:0 4px 0 #c47624}.btn.w{background:#eef3f8;color:var(--ink);box-shadow:0 4px 0 #c9d6e2}
.btn:disabled{opacity:.5;cursor:default}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:bold}.top .pill{background:#fff;border-radius:99px;padding:6px 14px;box-shadow:0 3px 0 #c9dff0}
.bar{flex:1;min-width:120px;height:16px;background:#dbe9f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#56ccf2,#27ae60);width:0;transition:width .4s}
.q{font-size:clamp(20px,3.6vw,28px);font-weight:bold;margin:8px 0}.hint{color:#6b7f99;font-size:16px}
.pic{display:block;margin:8px auto;max-width:100%;max-height:300px;border-radius:12px;background:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.opt{font:inherit;font-weight:bold;font-size:22px;padding:14px;border-radius:16px;border:3px solid #cfe0f1;background:#f7fbff;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}.opt.ok{background:#d4f5df;border-color:var(--green)}.opt.no{background:#ffe3cc;border-color:var(--orange)}
.fb{margin-top:12px;padding:12px;border-radius:14px;font-size:18px}.fb.ok{background:#d4f5df}.fb.no{background:#fff0e0}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:58px;padding:8px;border-radius:14px;margin:8px 0}.ans{background:#eef7ff;border:3px dashed #9cc7ee}
.tile{font:inherit;font-weight:bold;font-size:22px;padding:10px 16px;border-radius:12px;border:0;background:var(--sun);box-shadow:0 3px 0 #d4a900;cursor:pointer;color:var(--ink)}
table.t{border-collapse:collapse;margin:8px auto;font-size:20px}table.t td,table.t th{border:2px solid #9cc7ee;padding:6px 18px}table.t th{background:#dff0ff}
.rows{width:100%;border-collapse:collapse}.rows td,.rows th{padding:8px;border-bottom:1px solid #e2edf7;text-align:left}
.stars{font-size:34px;letter-spacing:4px}.rv{border-left:6px solid var(--orange);padding:8px 12px;margin:10px 0;background:#fffaf2;border-radius:8px}
.center{text-align:center}.snd{position:fixed;right:12px;top:12px;z-index:5;background:#fff;border:0;border-radius:99px;font-size:22px;padding:8px 12px;box-shadow:0 3px 0 #c9dff0;cursor:pointer}
</style></head><body>

const DATAERR=[];BANK.forEach(q=>{if(q.k=='mc'&&(!q.o.includes(q.a)||new Set(q.o).size!=q.o.length))DATAERR.push(q.id);if(q.img&&!IMG[q.img])DATAERR.push('img'+q.id);if(q.k=='od'&&[...norm(q.t.join('')).replace(/ /g,'')].sort().join('')!=[...norm(q.a).replace(/ /g,'')].sort().join(''))DATAERR.push('od'+q.id)});
function norm(s){return s.replace(/ \?/g,'?').toLowerCase().trim()}
const $=s=>document.querySelector(s),app=$('#app');let sndOn=true,ac;
function beep(f,d){if(!sndOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('#snd').onclick=()=>{sndOn=!sndOn;$('#snd').textContent=sndOn?'🔊':'🔇'};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const H=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let S=null,MAIN=null;// S: phiên đang chơi; MAIN: kết quả lượt chơi chính (không bị luyện tập ghi đè)
function home(){const n=BANK.length;app.innerHTML=`<div class="card center"><div class="mascot">🦉🎒</div><h1>ENGLISH 3 – SEMESTER 1 REVIEW</h1><div class="sub">Learn English through fun challenges!</div>
<p>English Adventure: vượt qua <b>5 vòng</b> để ôn tập Starter, Unit 1, 2, 4, 5. Chọn đáp án, sắp xếp từ hoặc chữ cái. Em sẽ biết đúng/sai ngay sau mỗi câu và được xem lại những câu cần ôn nhé!</p>
<p class="hint">Trò chơi có <b>${n} câu hỏi</b> chuyển từ bài tập trong file Word (mỗi câu 10 điểm). ${DATAERR.length?'⚠️ Dữ liệu có lỗi: '+DATAERR.join(', '):''}</p>
<button class="btn g" id="go" ${DATAERR.length?'disabled':''}>BẮT ĐẦU</button>
<div>${ROUNDS.map((r,i)=>`<button class="btn w" data-r="${i+1}">${r.e} Vòng ${i+1}: ${r.n} (${BANK.filter(q=>q.r==i+1).length})</button>`).join('')}</div><p class="hint">Bấm vào từng vòng để luyện riêng (kết quả luyện tập được lưu tách biệt).</p></div>`;
$('#go').onclick=()=>startMain();app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>startSession('practice',BANK.filter(q=>q.r==b.dataset.r),+b.dataset.r))}
function mk(mode,list,round){return{mode,list:list.map(q=>q),i:0,res:{},streak:0,round}}
function startMain(){S=mk('main',BANK,0);S.rd=1;intro()}
function startSession(mode,list,round){S=mk(mode,list,round);S.rd=round;if(mode=='main')intro();else{S.list=shuffle(list);S.rd=0;play()}}
function intro(){const r=ROUNDS[S.rd-1];app.innerHTML=`<div class="card center"><div class="mascot">${r.e}</div><h2>Vòng ${S.rd}: ${r.n}</h2><div class="sub">${r.u}</div><p>${r.t}</p><p class="hint">${BANK.filter(q=>q.r==S.rd).length} câu hỏi</p><button class="btn g" id="st">Chơi nào!</button></div>`;$('#st').onclick=()=>{S.list=shuffle(BANK.filter(q=>q.r==S.rd));S.i=0;play()}}
const allMain=()=>S.mode=='main'?BANK:S.list;
function stat(res){const v=Object.values(res);const c=v.filter(x=>x.s=='ok').length,w=v.filter(x=>x.s=='no').length,k=v.filter(x=>x.s=='skip').length;return{c,w,k,t:c+w,acc:c+w?Math.round(100*c/(c+w)):0,pts:c*10}}
function head(){const tot=S.mode=='main'?BANK.length:S.list.length,done=Object.keys(S.res).length,st=stat(S.res);
return`<div class="top"><span class="pill">${S.mode=='main'?'Vòng '+S.rd+' • '+ROUNDS[S.rd-1].n:'Luyện tập'}</span><div class="bar"><i style="width:${100*done/tot}%"></i></div><span class="pill">⭐ ${st.pts}</span><span class="pill">✅ ${st.c}</span><span class="pill">Còn ${tot-done}</span><span class="pill">🔥 ${S.streak}</span></div>`}
function play(){if(S.i>=S.list.length)return endRound();const q=S.list[S.i];S.cur=q;S.locked=false;
let body=`<div class="q">${H(q.p)}</div>${q.tb?TB:''}${q.img?`<img class="pic" alt="" src="${IMG[q.img]}">`:''}`;
if(q.k=='mc'){q.sh=shuffle(q.o);body+=`<div class="opts">${q.sh.map((o,i)=>`<button class="opt" data-i="${i}">${H(o)}</button>`).join('')}</div>`}
else{q.bank=shuffle(q.t.map((t,i)=>i));let g=0;while(q.t.length>1&&norm(q.bank.map(i=>q.t[i]).join(q.j))==norm(q.a)&&g++<20)q.bank=shuffle(q.bank);q.pick=[];body+=`<div class="tiles ans" id="ans"></div><div class="tiles" id="bank"></div><button class="btn" id="chk">Kiểm tra</button><button class="btn w" id="clr">Xóa</button><button class="btn w" id="rst">Làm lại</button>`}
app.innerHTML=`<div class="card">${head()}<div id="qa">${body}</div><div id="fb"></div><div class="center"><button class="btn w" id="skp">Bỏ qua ⏭</button></div></div>`;
$('#skp').onclick=()=>finish('skip');
if(q.k=='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.locked)return;const v=q.sh[+b.dataset.i];b.classList.add(v==q.a?'ok':'no');if(v!=q.a)app.querySelectorAll('.opt').forEach(x=>{if(q.sh[+x.dataset.i]==q.a)x.classList.add('ok')});finish(v==q.a?'ok':'no',v)});
else{const draw=()=>{$('#ans').innerHTML=q.pick.map((ix,p)=>`<button class="tile" data-p="${p}">${H(q.t[ix])}</button>`).join('');$('#bank').innerHTML=q.bank.filter(i=>!q.pick.includes(i)).map(i=>`<button class="tile" data-b="${i}">${H(q.t[i])}</button>`).join('');
$('#ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!S.locked){q.pick.splice(+b.dataset.p,1);draw()}});$('#bank').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!S.locked){q.pick.push(+b.dataset.b);draw()}})};draw();
$('#clr').onclick=()=>{if(!S.locked){q.pick.pop();draw()}};$('#rst').onclick=()=>{if(!S.locked){q.pick=[];draw()}};
$('#chk').onclick=()=>{if(S.locked||!q.pick.length)return;const got=q.pick.map(i=>q.t[i]).join(q.j);const ok=norm(got)==norm(q.a);finish(ok?'ok':'no',got)}}}
const PRAISE=['Excellent!','Well done!','Great job!'];
function finish(s,chosen){if(S.locked)return;S.locked=true;const q=S.cur;S.res[q.id]={s,chosen:chosen===undefined?'(bỏ qua)':chosen};
if(s=='ok'){S.streak++;beep(880,.15)}else{if(s=='no')S.streak=0;beep(300,.2)}

const last=S.i>=S.list.length-1;
$('#fb').innerHTML=`<div class="fb ${s=='ok'?'ok':'no'}">${s=='ok'?`⭐ <b>${PRAISE[S.i%3]}</b> +10 điểm${S.streak>=3?' • 🔥 Chuỗi '+S.streak+' câu đúng liên tiếp!':''}`:`💡 ${s=='skip'?'Em đã bỏ qua câu này.':'Gần đúng rồi, cố lên nhé!'} Đáp án đúng: <b>${H(q.a)}</b>`}<br>${H(q.x||'')}</div><div class="center"><button class="btn g" id="nx">${last?'Xem kết quả':'Câu tiếp theo ➜'}</button></div>`;
$('.top').outerHTML=head().replace(/^/,'');$('#skp').style.display='none';$('#nx').onclick=()=>{S.i++;play()};$('#nx').focus()}
function endRound(){if(S.mode=='main'&&S.rd<5){const ids=BANK.filter(q=>q.r==S.rd),st=stat(Object.fromEntries(ids.filter(q=>S.res[q.id]).map(q=>[q.id,S.res[q.id]])));
app.innerHTML=`<div class="card center"><div class="mascot">🏅</div><h2>Kết quả Vòng ${S.rd}: ${ROUNDS[S.rd-1].n}</h2><p class="stars">${stars(st.acc)}</p><p>Đúng <b>${st.c}</b> • Cần ôn <b>${st.w}</b> • Bỏ qua <b>${st.k}</b> • Điểm <b>${st.pts}</b></p><button class="btn g" id="nr">Vòng tiếp theo ➜</button></div>`;$('#nr').onclick=()=>{S.rd++;intro()};return}
summary()}
const stars=p=>p>=90?'⭐⭐⭐':p>=75?'⭐⭐':p>=50?'⭐':'🌱';
const msg=p=>p>=90?'Amazing! Em đã nắm rất tốt kiến thức!':p>=75?'Great job! Em hãy luyện thêm một chút nhé!':p>=50?'Good effort! Hãy ôn lại những câu chưa đúng!':'Keep trying! Mỗi lần luyện tập sẽ giúp em tiến bộ!';
function summary(){if(S.mode=='main')MAIN=S;const st=stat(S.res),done=Object.keys(S.res).length;const pr=[1,2,3,4,5].map(r=>{const o={};BANK.filter(q=>q.r==r&&S.res[q.id]).forEach(q=>o[q.id]=S.res[q.id]);return[r,stat(o),Object.keys(o).length]}).filter(x=>x[2]);

app.innerHTML=`<div class="card center"><div class="mascot">🏆</div><h1>${S.mode=='main'?'Tổng kết':'Kết quả luyện tập'}</h1>${S.mode!='main'?'<p class="hint">Kết quả luyện tập được tách riêng, không thay đổi kết quả lượt chơi chính.</p>':''}<p class="stars">${stars(st.acc)}</p><p class="sub">${msg(st.acc)}</p>
<p>Đã làm: <b>${done}</b> • Đúng: <b>${st.c}</b> • Sai: <b>${st.w}</b> • Bỏ qua: <b>${st.k}</b><br>Tổng điểm: <b>${st.pts}</b> • Tỉ lệ đúng: <b>${st.acc}%</b> <span class="hint">(đúng ÷ số câu đã chấm, không tính câu bỏ qua)</span></p>

<button class="btn o" id="rv" ${st.w?'':'disabled'}>XEM LẠI CÂU SAI</button><button class="btn" id="wk" ${weak.length?'':'disabled'}>ÔN TẬP VÒNG CHƯA TỐT</button><button class="btn g" id="re">CHƠI LẠI</button></div>`;
